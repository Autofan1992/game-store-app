type Cart {
  createdAt: Date!
  id: ID!
  items: [CartItem!]!
  updatedAt: Date!
  user: User!
}

type CartItem {
  amount: Int!
  cart: Cart!
  game: Game!
  id: ID!
}

type Comment {
  createdAt: String!
  game: Game!
  id: ID!
  isEditable: Boolean!
  isEdited: Boolean!
  text: String!
  updatedAt: String!
  user: User!
}

input CommentConnectionInput {
  pagination: ConnectionInputPagination
  where: CommentConnectionInputWhere
}

input CommentConnectionInputWhere {
  gameId: String!
  orderBy: OrderBy = asc
  sortCriteria: CommentSortCriteria
}

type CommentConnectionResponse {
  hasMore: Boolean!
  nodes: [Comment!]!
  totalCount: Int!
}

enum CommentSortCriteria {
  createdAt
  name
  updatedAt
}

input ConnectionInputPagination {
  skip: Int
  take: Int
}

input CreateCartItemInput {
  gameId: String!
}

input CreateCommentInput {
  gameId: String!
  text: String!
}

input CreateGameInput {
  ageLimit: Int!
  amount: Int!
  description: String!
  genre: GameGenre!
  imageId: String!
  name: String!
  platforms: [GamePlatform!]!
  price: Float!
}

"""
A date string, such as 2007-12-03, compliant with the `full-date` format outlined in section 5.6 of the RFC 3339 profile of the ISO 8601 standard for representation of dates and times using the Gregorian calendar.
"""
scalar Date

scalar File

type Game {
  ageLimit: Int!
  aggregate: GameAggregate!
  amount: Int!
  comments: [Comment!]!
  createdAt: Date!
  description: String!
  genre: String!
  id: ID!
  image: Resource!
  isEditable: Boolean!
  isLiked: Boolean!
  name: String!
  platforms: [GamePlatform!]!
  price: Float!
  updatedAt: Date!
  user: User!
  views: Int!
}

type GameAggregate {
  likes: Int!
  rating: Float
}

input GameConnectionInput {
  pagination: ConnectionInputPagination
  where: GameConnectionInputWhere
}

input GameConnectionInputWhere {
  ageLimit: Int
  genres: [GameGenre!]
  name: String
  orderBy: OrderBy = asc
  platforms: [GamePlatform!]
  sortCriteria: GameSortCriteria
}

type GameConnectionResponse {
  hasMore: Boolean!
  nodes: [Game!]!
  totalCount: Int!
}

enum GameGenre {
  Action
  RPG
  Sandbox
  Shooter
  Simulator
}

input GameInput {
  id: String!
}

enum GamePlatform {
  Pc
  Playstation
  Xbox
}

enum GameSortCriteria {
  name
  price
  rating
}

type Mutation {
  createCartItem(input: CreateCartItemInput!): CartItem!
  createComment(input: CreateCommentInput!): Comment!
  createGame(input: CreateGameInput!): Game!
  createOrder: Order!
  deleteCartItem(input: NodeInput!): CartItem!
  deleteComment(input: NodeInput!): Comment!
  deleteOrder(input: NodeInput!): Order!
  patchCartItem(input: PatchCartItemInput!): CartItem!
  patchComment(input: PatchCommentInput!): Comment!
  patchGame(input: PatchGameInput!): Game!
  patchOrder(input: PatchOrderInput!): Order!
  uploadResource(input: UploadResourceInput!): Resource
}

input NodeInput {
  id: String!
}

type Order {
  createdAt: Date!
  id: ID!
  items: [OrderItem!]!
  updatedAt: Date!
  user: User!
}

enum OrderBy {
  asc
  desc
}

type OrderItem {
  amount: Int!
  game: Game!
  id: ID!
  order: Order!
}

enum OrderStatus {
  Cancelled
  Confirmed
  Delivered
  Pending
  Shipped
}

input PatchCartItemInput {
  amount: Int
  itemId: String!
}

input PatchCommentInput {
  id: String!
  text: String
}

input PatchGameInput {
  ageLimit: Int
  amount: Int
  description: String
  genre: GameGenre
  id: String!
  imageId: String
  like: Boolean
  name: String
  price: Float
  rating: Float
}

input PatchOrderInput {
  id: String!
  paymentStatus: PaymentStatus
  status: OrderStatus
}

enum PaymentStatus {
  Confirmed
  Failed
  Pending
}

type Query {
  cart: Cart
  commentConnection(input: CommentConnectionInput): CommentConnectionResponse!
  game(input: GameInput!): Game
  gameConnection(input: GameConnectionInput): GameConnectionResponse!
  me: User
}

type Resource {
  id: ID!
  mimetype: String!
  name: String!
  url: String!
}

type Subscription {
  commentAdded: Comment!
}

input UploadResourceInput {
  resource: File!
}

type User {
  avatar: String
  createdAt: Date!
  email: String!
  id: ID!
  role: UserRole!
  updatedAt: Date!
}

enum UserRole {
  Admin
  User
}